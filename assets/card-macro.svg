<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="Macro Stress and Asset Behavior — Gold, SPY, and Bitcoin across stress regimes">
  <rect width="420" height="150" rx="10" fill="#151126"/>
  <rect width="420" height="150" rx="10" fill="none" stroke="#2e2650" stroke-width="1.5"/>
  <rect x="0" y="0" width="420" height="3" rx="1.5" fill="#8b5cf6"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="22" y="34" font-size="10.5" fill="#9a92b2" letter-spacing="1.5">RESEARCH · GROUP PROJECT</text>
    <text x="22" y="58" font-size="16.5" font-weight="700" fill="#f4f1ff">Macro Stress &amp; Asset Behavior</text>
    <text x="22" y="78" font-size="10.5" fill="#9a92b2">gold vs. bitcoin as safe havens under market stress</text>

    <!-- motif: stress band + three lines -->
    <g transform="translate(22, 88)">
      <rect x="52" y="2" width="34" height="42" fill="#8b5cf6" fill-opacity="0.14"/>
      <line x1="52" y1="2" x2="52" y2="44" stroke="#8b5cf6" stroke-opacity="0.5" stroke-dasharray="2.5 2.5"/>
      <line x1="86" y1="2" x2="86" y2="44" stroke="#8b5cf6" stroke-opacity="0.5" stroke-dasharray="2.5 2.5"/>
      <line x1="0" y1="24" x2="150" y2="24" stroke="#3a3160" stroke-width="0.8"/>
      <!-- spy -->
      <polyline points="0,16 25,14 52,18 62,32 74,38 86,30 110,20 150,16"
        fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- btc -->
      <polyline points="0,20 25,12 52,18 62,40 74,44 86,34 110,14 150,8"
        fill="none" stroke="#c4b5fd" stroke-width="1.6" stroke-dasharray="4 2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- gold -->
      <polyline points="0,20 25,18 52,20 62,21 74,20 86,19 110,17 150,16"
        fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <text x="398" y="140" text-anchor="end" font-size="10" fill="#8b5cf6">4,150 obs · walk-forward · xgboost</text>
  </g>
</svg>
