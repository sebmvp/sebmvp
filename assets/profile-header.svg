    <g fill="#67e8f9">
      <circle cx="80" cy="13" r="2.2"/><circle cx="80" cy="33" r="2.2"/><circle cx="80" cy="53" r="2.2"/>
      <circle cx="80" cy="73" r="2.2"/><circle cx="80" cy="93" r="2.2"/><circle cx="80" cy="113" r="2.2"/>
    </g>
    <g stroke="#a78bfa" stroke-width="1.3" opacity="0.8">
      <line x1="88" y1="13" x2="122" y2="13"/><line x1="88" y1="33" x2="118" y2="33"/>
      <line x1="88" y1="53" x2="124" y2="53"/><line x1="88" y1="73" x2="116" y2="73"/>
      <line x1="88" y1="93" x2="122" y2="93"/><line x1="88" y1="113" x2="120" y2="113"/>
    </g>
