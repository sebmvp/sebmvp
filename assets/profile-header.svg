<svg xmlns="http://www.w3.org/2000/svg" width="860" height="188" viewBox="0 0 860 188" role="img" aria-label="Seb — building systems for messy data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/>
      <stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <pattern id="grid" width="43" height="47" patternUnits="userSpaceOnUse">
      <path d="M43 0H0V47" fill="none" stroke="#241d3d" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="860" height="188" rx="10" fill="url(#bg)"/>
  <rect width="860" height="188" rx="10" fill="url(#grid)"/>
  <rect width="860" height="188" rx="10" fill="none" stroke="#2e2650" stroke-width="1.5"/>

  <rect x="28" y="28" width="4" height="132" rx="2" fill="#8b5cf6"/>

  <circle cx="52" cy="42" r="4" fill="#8b5cf6"/>
  <text x="64" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#9a92b2" letter-spacing="2">~/seb</text>

  <text x="48" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="33" font-weight="700" fill="#f4f1ff" letter-spacing="0.5">Seb</text>

  <text x="48" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#a78bfa" letter-spacing="0.4">building systems for messy data</text>

  <text x="48" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#9a92b2" letter-spacing="0.4">python / sql / pipelines / retrieval / automation</text>
  <text x="48" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#9a92b2" letter-spacing="0.4"><tspan fill="#67e8f9">&gt;</tspan> currently: making data easier to trust</text>

  <!-- motif: scattered rows -> gate -> structured warehouse blocks -->
  <g transform="translate(628, 30)">
    <g stroke="#9a92b2" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="10" x2="26" y2="6"/>
      <line x1="2" y1="26" x2="30" y2="24"/>
      <line x1="0" y1="44" x2="22" y2="40"/>
      <line x1="4" y1="60" x2="28" y2="58"/>
      <line x1="0" y1="78" x2="24" y2="74"/>
      <line x1="2" y1="96" x2="30" y2="92"/>
      <line x1="0" y1="114" x2="20" y2="110"/>
    </g>

    <line x1="52" y1="4" x2="52" y2="124" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="52" cy="64" r="7" fill="#0d0b16" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M48.5 64 l2.5 2.5 l4.5 -5" stroke="#8b5cf6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.5">
      <rect x="72" y="6" width="58" height="14" rx="3"/>
      <rect x="72" y="26" width="58" height="14" rx="3"/>
      <rect x="72" y="46" width="58" height="14" rx="3"/>
      <rect x="72" y="66" width="58" height="14" rx="3"/>
      <rect x="72" y="86" width="58" height="14" rx="3"/>
      <rect x="72" y="106" width="58" height="14" rx="3"/>
